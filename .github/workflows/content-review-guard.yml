name: Content Review Guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  pull_request_review:
    branches:
      - main
    types:
      - submitted
      - dismissed

permissions:
  contents: read
  pull-requests: read

jobs:
  require-approval:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Require approval for protected content changes
        uses: actions/github-script@v7
        with:
          script: |
            const protectedPatterns = [/^index\.html$/, /^404\.html$/, /^sitemap\.xml$/];
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number,
              per_page: 100
            });

            const protectedFiles = files
              .map((file) => file.filename)
              .filter((file) => protectedPatterns.some((pattern) => pattern.test(file)));

            if (protectedFiles.length === 0) {
              core.info('No protected content files changed.');
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100
            });

            const latestStateByReviewer = new Map();
            for (const review of reviews) {
              const login = review.user && review.user.login;
              if (!login) {
                continue;
              }
              latestStateByReviewer.set(login, review.state);
            }

            const approvals = [...latestStateByReviewer.values()].filter((state) => state === 'APPROVED');
            if (approvals.length < 1) {
              core.setFailed(
                `Protected content files changed (${protectedFiles.join(', ')}). At least one PR approval is required before merging to main.`
              );
              return;
            }

            core.info(
              `Protected content files changed (${protectedFiles.join(', ')}). Approval requirement satisfied.`
            );

name: SEO Freshness Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  seo-update:
    name: Hourly SEO Freshness Update
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "📦 Found lockfile — running npm ci"
            npm ci
          else
            echo "📦 No lockfile — running npm install"
            npm install
          fi

      - name: Run fresh-data
        id: fresh_data
        run: |
          echo "🔄 Generating fresh data..."
          npm run fresh-data
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run rotate-content
        id: rotate_content
        run: |
          echo "🔀 Rotating dynamic content..."
          npm run rotate-content
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run update-schema
        id: update_schema
        run: |
          echo "📋 Updating JSON-LD schema timestamps..."
          npm run update-schema
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run generate-sitemap
        id: generate_sitemap
        run: |
          echo "🗺️ Generating sitemap.xml..."
          npm run generate-sitemap
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run notify-indexing
        id: notify_indexing
        run: |
          echo "📡 Notifying search engine indexing endpoints..."
          npm run notify-indexing
          echo "status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Detect file changes
        id: detect_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No file changes detected — skipping commit."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✅ File changes detected."
            git diff --name-only
          fi

      - name: Commit and push changes
        if: steps.detect_changes.outputs.changed == 'true'
        run: |
          git add -A
          git commit -m "chore(seo): hourly freshness update [skip ci]"
          git push

      - name: Write job summary
        if: always()
        run: |
          echo "## 📊 SEO Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| fresh-data | ${{ steps.fresh_data.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| rotate-content | ${{ steps.rotate_content.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| update-schema | ${{ steps.update_schema.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| generate-sitemap | ${{ steps.generate_sitemap.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| notify-indexing | ${{ steps.notify_indexing.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| commit | ${{ steps.detect_changes.outputs.changed == 'true' && 'committed' || 'no changes' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run triggered at: $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY

  workflow-status:
    name: Final Workflow Status
    runs-on: ubuntu-latest
    needs: seo-update
    if: always()
    permissions: {}

    steps:
      - name: Report final status
        run: |
          echo "## ✅ SEO Workflow Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Upstream job result:** ${{ needs.seo-update.result }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.seo-update.result }}" = "success" ]; then
            echo "🟢 All SEO update steps completed successfully."
          else
            echo "🟡 SEO update job finished with result: ${{ needs.seo-update.result }}"
          fi
